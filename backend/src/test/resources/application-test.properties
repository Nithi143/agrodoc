# ==============================================================================
# AgroDoc — Test Profile Properties
# Used by JUnit / @SpringBootTest — connects to H2 in-memory database.
# No MySQL installation required to run tests.
# ==============================================================================

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:agrodoc_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate — create schema from entities in test (H2 doesn't use schema.sql)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# H2 Console (useful for local test debugging)
spring.h2.console.enabled=false

# JWT — use a predictable test secret
jwt.secret=TEST_SECRET_KEY_DO_NOT_USE_IN_PRODUCTION_MIN32
jwt.expiration-ms=3600000

# Disable AI API calls in tests
plant.api.key=TEST_KEY_NOT_USED
plant.api.base-url=http://localhost:9999/mock

# Upload dir for tests
agrodoc.upload.dir=target/test-uploads
