# ==============================================================================
# AgroDoc — Spring Boot Application Properties
# ==============================================================================
# All sensitive values (passwords, keys) are loaded from environment variables.
# Do NOT hardcode credentials in this file.
#
# To run locally, create application-dev.properties and set the actual values.
# application-dev.properties is listed in .gitignore and must NEVER be committed.
# ==============================================================================

# Active profile — switch to 'dev' locally, 'prod' in production
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ------------------------------------------------------------------------------
# Application Name
# ------------------------------------------------------------------------------
spring.application.name=AgroDoc

# ------------------------------------------------------------------------------
# Server Port
# ------------------------------------------------------------------------------
server.port=8080

# ------------------------------------------------------------------------------
# Database Connection (values loaded from environment variables or dev profile)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agrodoc_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool (HikariCP — Spring Boot default)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ------------------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------------------
# validate: checks that DB schema matches entities (safe for production)
# update:   auto-updates schema from entities (OK for development only)
# none:     no schema management (use when schema.sql controls DDL)
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# File Upload Limits
# ------------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ------------------------------------------------------------------------------
# JWT Configuration
# ------------------------------------------------------------------------------
# The jwt.secret must be at least 32 characters (256-bit) for HS256 signing.
# Load from environment variable in all environments.
jwt.secret=${JWT_SECRET:REPLACE_THIS_WITH_A_SECURE_KEY_MINIMUM_32_CHARS}
jwt.expiration-ms=86400000
jwt.remember-me-expiration-ms=604800000

# ------------------------------------------------------------------------------
# External Plant Disease AI API
# (Keys loaded from environment variables — never hardcoded here)
# ------------------------------------------------------------------------------
plant.api.key=${PLANT_API_KEY:NOT_YET_CONFIGURED}
plant.api.base-url=${PLANT_API_BASE_URL:https://plant.id/api/v3}

# Local directory for storing uploaded leaf images (outside web-accessible path)
agrodoc.upload.dir=${UPLOAD_DIR:uploads}
agrodoc.upload.max-size-bytes=5242880

# ------------------------------------------------------------------------------
# CORS Allowed Origins
# (Comma-separated list of allowed frontend origins)
# ------------------------------------------------------------------------------
agrodoc.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
logging.level.root=WARN
logging.level.com.agrodoc=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
